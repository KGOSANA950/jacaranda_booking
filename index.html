<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacaranda House – Book a Room</title>
<style>
:root{--ink:#241a33;--muted:#6b6280;--lilac:#6d4fb8;--lilac-d:#523a94;--soft:#ece6f7;--sand:#f8f4ee;--line:#ddd5ea;--amber:#c97a0a;--green:#2e7d5b;--red:#b3362f;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sand);color:var(--ink);line-height:1.5}
h1,h2,h3,.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-size:1.35rem;color:var(--lilac-d)}
.cartbtn{background:var(--lilac);color:#fff;border:0;border-radius:999px;padding:9px 18px;font-weight:600}
.cartbtn span{background:#fff;color:var(--lilac-d);border-radius:999px;padding:1px 8px;margin-left:6px;font-size:.85rem}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#3a2766,#6d4fb8 60%,#a98be0);color:#fff;padding:70px 5vw 110px}
.hero h1{font-size:clamp(2rem,5.5vw,3.8rem);max-width:15ch;line-height:1.08}
.hero p{max-width:46ch;margin-top:16px;opacity:.92;font-size:1.05rem}
.petal{position:absolute;top:-30px;width:12px;height:16px;background:#e3d3ff;border-radius:60% 40% 60% 40%;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(520px) rotate(360deg) translateX(40px)}}
.bar{margin:-60px 5vw 0;position:relative;z-index:5;background:#fff;border-radius:16px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;box-shadow:0 12px 30px rgba(36,26,51,.18)}
.bar label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.bar input,.bar select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
.summary{display:flex;flex-direction:column;justify-content:center;background:var(--soft);border-radius:10px;padding:8px 14px}
.summary b{font-size:1.5rem;color:var(--lilac-d);font-family:Georgia,serif}
main{padding:40px 5vw 60px}
main>h2{font-size:1.8rem;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.card.out{opacity:.7}
.pic{position:relative;aspect-ratio:400/260;background:var(--soft)}
.pic svg{width:100%;height:100%;display:block}
.badge{position:absolute;top:12px;left:12px;padding:5px 12px;border-radius:999px;font-size:.8rem;font-weight:700;color:#fff;background:var(--green)}
.badge.low{background:var(--amber)}.badge.none{background:var(--red)}
.body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{font-size:1.25rem}
.body p{color:var(--muted);font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--soft);color:var(--lilac-d);border-radius:6px;padding:2px 9px;font-size:.78rem}
.meter{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .6s ease,background .3s}
.meter i.low{background:var(--amber)}.meter i.none{background:var(--red)}
.left{font-size:.88rem;font-weight:600}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:6px}
.price{font-family:Georgia,serif;font-size:1.4rem;color:var(--lilac-d)}
.price small{font-family:system-ui;font-size:.78rem;color:var(--muted)}
.add{display:flex;gap:8px}
.add select{padding:8px;border:1px solid var(--line);border-radius:10px;font:inherit}
.btn{background:var(--lilac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;transition:background .2s,transform .1s}
.btn:hover{background:var(--lilac-d)}.btn:active{transform:scale(.97)}
.btn:disabled{background:#b9b2c6;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--lilac-d);border:1px solid var(--lilac)}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:#fff;z-index:40;transform:translateX(105%);transition:transform .35s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer.open{transform:none}
.drawer header{position:static;border-bottom:1px solid var(--line)}
.dbody{padding:18px;overflow:auto;flex:1}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item small{color:var(--muted)}
.rm{background:none;border:0;color:var(--red);font-size:.85rem;text-decoration:underline}
.total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;padding:16px 18px;border-top:1px solid var(--line)}
.dfoot{padding:0 18px 18px}
.dfoot .btn{width:100%}
.shade{position:fixed;inset:0;background:rgba(36,26,51,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:50;padding:16px}
.modal.on{display:grid}
.box{background:#fff;border-radius:18px;padding:26px;width:min(460px,100%);max-height:92vh;overflow:auto;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.box h2{margin-bottom:12px}
.box label{display:block;font-size:.85rem;margin:12px 0 4px;color:var(--muted)}
.box input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit}
.err{color:var(--red);font-size:.85rem;margin-top:8px;min-height:1.2em}
.ok{text-align:center}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--green);color:#fff;font-size:2rem;display:grid;place-items:center;margin:0 auto 12px}
.ref{font-family:Georgia,serif;font-size:1.6rem;color:var(--lilac-d);letter-spacing:.05em;margin:6px 0 12px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 5vw 40px}
footer button{background:none;border:0;color:var(--lilac-d);text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">Jacaranda House</div>
  <button class="cartbtn" id="openCart" aria-label="Open your booking">Your booking<span id="cartCount">0</span></button>
</header>

<section class="hero" id="hero">
  <h1>Wake up under the jacarandas.</h1>
  <p>Quiet rooms in the heart of Pretoria. Pick your dates and see exactly how many rooms are left for your stay.</p>
</section>

<section class="bar" aria-label="Search">
  <div><label for="ci">Check-in</label><input type="date" id="ci"></div>
  <div><label for="co">Check-out</label><input type="date" id="co"></div>
  <div><label for="gs">Guests per room</label>
    <select id="gs"><option value="1">1 guest</option><option value="2" selected>2 guests</option><option value="3">3 guests</option><option value="4">4 guests</option></select></div>
  <div class="summary"><span style="font-size:.8rem;color:var(--muted)" id="sumLabel"></span><b id="sumRooms">0</b></div>
</section>

<main>
  <h2>Rooms for your stay</h2>
  <p class="sub" id="nightsLabel"></p>
  <div class="grid" id="grid"></div>
</main>

<footer>Jacaranda House demo site. No real payment is taken.<br><button id="reset">Reset demo bookings</button></footer>

<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Your booking">
  <header><div class="brand">Your booking</div><button class="btn ghost" id="closeCart">Close</button></header>
  <div class="dbody" id="cartBody"></div>
  <div class="total"><span>Total</span><span id="cartTotal">R0</span></div>
  <div class="dfoot"><button class="btn" id="checkout">Continue to checkout</button></div>
</aside>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
/* ---------- Data ---------- */
const ROOMS=[
 {id:'std',name:'Standard Queen',price:890,total:12,cap:2,desc:'A calm room with a queen bed, desk and garden-facing window.',tags:['Queen bed','Wi-Fi','Breakfast'],kind:'queen',pal:['#efe7f7','#c9a77c','#7a5cc2','#9fd0ee']},
 {id:'dlx',name:'Deluxe King',price:1450,total:8,cap:2,desc:'More space, a king bed and a reading corner by the window.',tags:['King bed','Balcony','Mini bar'],kind:'king',pal:['#f6ebdc','#b88a5a','#2f6f6a','#bfe3f5']},
 {id:'gst',name:'Garden Studio',price:1250,total:6,cap:3,desc:'Ground floor studio that opens straight onto the jacaranda lawn.',tags:['Sleeps 3','Garden access','Kitchenette'],kind:'studio',pal:['#e6f1e4','#a9855d','#4e8f5a','#cfeaf7']},
 {id:'fam',name:'Family Suite',price:2100,total:5,cap:4,desc:'Two bedrooms-worth of space with a double and two single beds.',tags:['Sleeps 4','2 bathrooms','Lounge'],kind:'family',pal:['#fbe9e4','#b58b66','#c4574a','#c3e5f6']},
 {id:'exe',name:'Executive Suite',price:3200,total:3,cap:2,desc:'Our top floor suite with a lounge, work desk and city views.',tags:['King bed','City view','Lounge'],kind:'suite',pal:['#e9e6f4','#8f7656','#3a2766','#f3c98b']}
];

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const R=n=>'R'+n.toLocaleString('en-ZA');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>new Date(s+'T00:00:00');
const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
let bookings=[];
try{bookings=JSON.parse(localStorage.getItem('jh_bookings')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('jh_bookings',JSON.stringify(bookings))}catch(e){}};
let cart=[];

const today=new Date();
$('ci').min=iso(today);
const d1=new Date(today);d1.setDate(d1.getDate()+1);
const d2=new Date(today);d2.setDate(d2.getDate()+3);
$('ci').value=iso(d1);$('co').value=iso(d2);

function nights(){
  const a=parse($('ci').value),b=parse($('co').value),out=[];
  if(isNaN(a)||isNaN(b)||b<=a)return out;
  for(let d=new Date(a);d<b;d.setDate(d.getDate()+1))out.push(iso(d));
  return out;
}
function bookedOn(room,date){
  const base=hash(room.id+date)%(Math.floor(room.total*0.7)+1);
  let mine=0;
  bookings.forEach(b=>{if(b.id===room.id&&date>=b.ci&&date<b.co)mine+=b.qty});
  return Math.min(room.total,base+mine);
}
function available(room){
  const ns=nights();if(!ns.length)return 0;
  return room.total-Math.max(...ns.map(d=>bookedOn(room,d)));
}
const inCart=id=>(cart.find(c=>c.id===id)||{qty:0}).qty;
const freeNow=r=>Math.max(0,available(r)-inCart(r.id));

/* ---------- Room pictures (inline SVG, no downloads needed) ---------- */
function pic(r){
  const [wall,floor,bed,sky]=r.pal;
  let s=`<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${r.name} illustration">
  <rect width="400" height="260" fill="${wall}"/>
  <rect y="190" width="400" height="70" fill="${floor}"/>
  <rect y="186" width="400" height="6" fill="rgba(0,0,0,.12)"/>
  <rect x="270" y="38" width="94" height="104" rx="6" fill="#fff"/>
  <rect x="276" y="44" width="82" height="92" fill="${sky}"/>
  <path d="M276 136 Q300 100 318 122 Q336 90 358 136Z" fill="#b9a2e8"/>
  <circle cx="338" cy="68" r="11" fill="#fff6c9"/>
  <rect x="316" y="44" width="4" height="92" fill="#fff"/><rect x="276" y="88" width="82" height="4" fill="#fff"/>`;
  const bedDraw=(x,w,col)=>`<rect x="${x}" y="110" width="${w*0.14}" height="86" rx="6" fill="#4a3a35"/>
   <rect x="${x}" y="150" width="${w}" height="44" rx="8" fill="${col}"/>
   <rect x="${x+8}" y="140" width="${w*0.3}" height="20" rx="9" fill="#fff"/>
   <rect x="${x+w*0.4}" y="158" width="${w*0.58}" height="14" rx="5" fill="rgba(255,255,255,.35)"/>
   <rect x="${x+6}" y="194" width="6" height="12" fill="#4a3a35"/><rect x="${x+w-12}" y="194" width="6" height="12" fill="#4a3a35"/>`;
  if(r.kind==='family'){s+=bedDraw(30,130,bed)+bedDraw(180,70,'#e9a07c')}
  else if(r.kind==='studio'){s+=bedDraw(30,150,bed)+`<rect x="200" y="150" width="56" height="44" rx="6" fill="#6b5a4a"/><rect x="204" y="130" width="48" height="26" rx="5" fill="#8a7765"/>`}
  else if(r.kind==='suite'){s+=bedDraw(30,170,bed)+`<rect x="232" y="158" width="130" height="34" rx="8" fill="#5b4a7a"/><rect x="232" y="138" width="130" height="26" rx="8" fill="#76639a"/><rect x="236" y="192" width="6" height="12" fill="#2d2240"/><rect x="352" y="192" width="6" height="12" fill="#2d2240"/>`}
  else{s+=bedDraw(40,r.kind==='king'?190:160,bed)}
  s+=`<rect x="14" y="170" width="18" height="24" fill="#4a3a35"/><circle cx="23" cy="150" r="14" fill="#ffe8a8"/>
  <rect x="150" y="30" width="60" height="40" fill="#fff" stroke="#4a3a35" stroke-width="3"/><circle cx="170" cy="50" r="8" fill="${bed}"/><rect x="182" y="42" width="20" height="16" fill="#e8d8ff"/>
  </svg>`;
  return s;
}

/* ---------- Render rooms ---------- */
function renderRooms(){
  const guests=+$('gs').value,ns=nights();
  $('nightsLabel').textContent=ns.length?`${ns.length} night${ns.length>1?'s':''} from ${$('ci').value} to ${$('co').value}. Availability shows the fewest rooms free on any night of your stay.`:'Choose a check-out date after your check-in date.';
  // clamp cart
  cart=cart.filter(c=>{const r=ROOMS.find(x=>x.id===c.id);c.qty=Math.min(c.qty,available(r));return c.qty>0});
  let totalLeft=0;
  const list=ROOMS.filter(r=>r.cap>=guests);
  $('grid').innerHTML=list.map(r=>{
    const left=freeNow(r),pct=Math.round(left/r.total*100);totalLeft+=left;
    const cls=left===0?'none':left<=2?'low':'';
    const msg=left===0?'Sold out for these dates':left<=2?`Only ${left} left`:`${left} of ${r.total} rooms available`;
    const opts=Array.from({length:Math.min(left,5)},(_,i)=>`<option>${i+1}</option>`).join('');
    return `<article class="card ${left===0?'out':''}">
      <div class="pic">${pic(r)}<div class="badge ${cls}">${left===0?'Sold out':left+' left'}</div></div>
      <div class="body"><h3>${r.name}</h3><p>${r.desc}</p>
        <div class="tags">${r.tags.map(t=>`<span>${t}</span>`).join('')}<span>Up to ${r.cap} guests</span></div>
        <div class="left" style="color:${left===0?'var(--red)':left<=2?'var(--amber)':'var(--green)'}">${msg}</div>
        <div class="meter"><i class="${cls}" style="width:${pct}%"></i></div>
        <div class="foot"><div class="price">${R(r.price)}<small> / night</small></div>
          <div class="add"><select id="q-${r.id}" aria-label="Rooms" ${left===0?'disabled':''}>${opts||'<option>0</option>'}</select>
          <button class="btn" data-add="${r.id}" ${left===0||!ns.length?'disabled':''}>${left===0?'Unavailable':'Add'}</button></div></div>
      </div></article>`}).join('')||'<p class="empty">No rooms fit that many guests.</p>';
  $('sumLabel').textContent='Rooms free for your dates';
  $('sumRooms').textContent=totalLeft;
  renderCart();
}

/* ---------- Cart ---------- */
function cartTotal(){return cart.reduce((s,c)=>s+ROOMS.find(r=>r.id===c.id).price*c.qty*nights().length,0)}
function renderCart(){
  $('cartCount').textContent=cart.reduce((s,c)=>s+c.qty,0);
  $('cartBody').innerHTML=cart.length?cart.map(c=>{const r=ROOMS.find(x=>x.id===c.id);
    return `<div class="item"><div><b>${r.name}</b><br><small>${c.qty} room${c.qty>1?'s':''} x ${nights().length} night${nights().length>1?'s':''} at ${R(r.price)}</small><br><button class="rm" data-rm="${r.id}">Remove</button></div><b>${R(r.price*c.qty*nights().length)}</b></div>`}).join(''):'<p class="empty">Your booking is empty. Add a room to get started.</p>';
  $('cartTotal').textContent=R(cartTotal());
  $('checkout').disabled=!cart.length;
}
function openCart(on){$('drawer').classList.toggle('open',on);$('shade').classList.toggle('on',on)}
$('openCart').onclick=()=>openCart(true);
$('closeCart').onclick=()=>openCart(false);
$('shade').onclick=()=>{openCart(false);closeModal()};

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-add]'),m=e.target.closest('[data-rm]');
  if(a){const id=a.dataset.add,q=+$('q-'+id).value,r=ROOMS.find(x=>x.id===id);
    if(q<=freeNow(r)){const c=cart.find(x=>x.id===id);c?c.qty+=q:cart.push({id,qty:q});renderRooms();openCart(true)}}
  if(m){cart=cart.filter(c=>c.id!==m.dataset.rm);renderRooms()}
});
['ci','co','gs'].forEach(id=>$(id).addEventListener('change',()=>{
  if(id==='ci'&&$('co').value<=$('ci').value){const d=parse($('ci').value);d.setDate(d.getDate()+1);$('co').value=iso(d)}
  $('co').min=$('ci').value;renderRooms()}));

/* ---------- Checkout ---------- */
function closeModal(){$('modal').classList.remove('on');$('shade').classList.remove('on')}
$('checkout').onclick=()=>{
  openCart(false);
  $('box').innerHTML=`<h2>Guest details</h2>
   <p class="sub" style="margin:0">${cart.reduce((s,c)=>s+c.qty,0)} room(s), ${nights().length} night(s). Total <b>${R(cartTotal())}</b></p>
   <label for="nm">Full name</label><input id="nm" autocomplete="name">
   <label for="em">Email</label><input id="em" type="email" autocomplete="email">
   <label for="ph">Phone</label><input id="ph" type="tel" autocomplete="tel">
   <label for="cd">Card number (demo only, nothing is charged)</label><input id="cd" inputmode="numeric" placeholder="4242 4242 4242 4242">
   <div class="err" id="err"></div>
   <div style="display:flex;gap:10px;margin-top:10px"><button class="btn ghost" id="cancel">Back</button><button class="btn" id="pay" style="flex:1">Confirm and pay ${R(cartTotal())}</button></div>`;
  $('modal').classList.add('on');$('shade').classList.add('on');
  $('cancel').onclick=()=>{closeModal();openCart(true)};
  $('pay').onclick=confirmBooking;
};
function confirmBooking(){
  const nm=$('nm').value.trim(),em=$('em').value.trim(),ph=$('ph').value.trim(),cd=$('cd').value.replace(/\s/g,'');
  if(nm.length<2)return $('err').textContent='Enter your full name.';
  if(!/^\S+@\S+\.\S+$/.test(em))return $('err').textContent='Enter a valid email address.';
  if(ph.replace(/\D/g,'').length<9)return $('err').textContent='Enter a valid phone number.';
  if(!/^\d{12,19}$/.test(cd))return $('err').textContent='Enter a card number with 12 to 19 digits.';
  for(const c of cart){const r=ROOMS.find(x=>x.id===c.id);if(c.qty>available(r))return $('err').textContent=`${r.name} just sold out. Go back and adjust your booking.`}
  const ref='JH-'+Math.random().toString(36).slice(2,8).toUpperCase(),total=cartTotal(),summary=cart.map(c=>`${c.qty} x ${ROOMS.find(r=>r.id===c.id).name}`).join(', ');
  cart.forEach(c=>bookings.push({ref,id:c.id,qty:c.qty,ci:$('ci').value,co:$('co').value,name:nm}));
  save();cart=[];
  $('box').innerHTML=`<div class="ok"><div class="tick">&#10003;</div><h2>Booking confirmed</h2>
   <p>Thank you, ${nm.replace(/</g,'&lt;')}. Your reference is</p><div class="ref">${ref}</div>
   <p>${summary}<br>${$('ci').value} to ${$('co').value}<br><b>${R(total)}</b></p>
   <button class="btn" id="done" style="margin-top:16px">Done</button></div>`;
  $('done').onclick=closeModal;renderRooms();
}
$('reset').onclick=()=>{bookings=[];save();cart=[];renderRooms()};

/* ---------- Falling petals (hero) ---------- */
for(let i=0;i<18;i++){const p=document.createElement('i');p.className='petal';
  p.style.left=Math.random()*100+'%';p.style.animationDuration=(6+Math.random()*7)+'s';p.style.animationDelay=(-Math.random()*10)+'s';
  p.style.transform=`scale(${.6+Math.random()})`;$('hero').appendChild(p)}

$('co').min=$('ci').value;
renderRooms();
</script>
</body>
</html>
